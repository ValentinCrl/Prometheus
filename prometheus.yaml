global:
  scrape_interval: 10s  # Intervalle de scraping par défaut
  external_labels:
    environment: 'prod'  # Label global pour identifier l'environnement

  

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']



